<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="HandheldFriendly" content="true" />
    <meta name="MobileOptimized" content="width" />
    <meta name="format-detection" content="telephone=no" />
    <title>Unity Earning Live Chat</title>
    <meta name="description" content="A lightweight, fast, and real-time messaging web application optimized for slow connections and mobile devices." />
    <meta property="og:title" content="Unity Earning Live Chat" />
    <meta property="og:description" content="A lightweight, fast, and real-time messaging web application optimized for slow connections and mobile devices." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Fonts: Hind Siliguri (Bangla), Plus Jakarta Sans (Latin Display & Body), JetBrains Mono (Numbers/Codes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Prevent pinch-to-zoom, gesture zoom, and double tap zoom across mobile browsers
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturechange', function(e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gestureend', function(e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
